[project]
name = "stompman-workspace"
requires-python = ">=3.11"
version = "0"

[dependency-groups]
dev = [
    "anyio==4.15.1",
    "faker==40.39.0",
    "hypothesis==6.168.0",
    "mypy==2.3.1",
    "polyfactory==3.3.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "ruff==0.16.8",
    "uvloop==0.22.1",
]
ws = [
    "websockets==17.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
stompman = { workspace = true }


[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
strict = true

[tool.ruff]
fix = true
unsafe-fixes = true
line-length = 120

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "ASYNC109",
    "COM812",
    "CPY001",
    "D1",
    "D203",
    "D213",
    "DOC201",
    "DOC501",
    "ISC001",
    "PLC2701",
    "PLC2801",
    "PLR0913",
    "RUF105",
    "RUF201",
    "SLF001"
]
extend-per-file-ignores = { "*/test_*/*" = ["S101", "SLF001", "ARG", "PLR6301"] }

[tool.pytest.ini_options]
addopts = "--cov -s -vv"

[tool.coverage.report]
skip_covered = true
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]
